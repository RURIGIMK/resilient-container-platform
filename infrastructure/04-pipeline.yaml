AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Resilient container platform - serverless CI/CD with NO credentials shared between GitHub and AWS.
  A scheduled CodeBuild "poller" reads the PUBLIC GitHub repo anonymously, and when main has a new
  commit it drops a source zip in S3. That S3 event starts CodePipeline:
  Source (S3) -> Build (CodeBuild: test + build web & worker images -> ECR) -> Deploy (ECS rolling updates).

Parameters:
  ProjectName:
    Type: String
    Default: shop
  RepositoryUrl:
    Type: String
    Default: https://github.com/RURIGIMK/resilient-container-platform.git
  Branch:
    Type: String
    Default: main
  PollSchedule:
    Type: String
    Default: rate(5 minutes)

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration: { Status: Enabled }   # required by the S3 source action
      NotificationConfiguration:
        EventBridgeConfiguration: { EventBridgeEnabled: true }
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-artifacts
            Status: Enabled
            ExpirationInDays: 14
            NoncurrentVersionExpiration: { NoncurrentDays: 7 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  LastCommitParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/pipeline/last-commit'
      Type: String
      Value: none
      Description: Last commit SHA on main that was handed to CodePipeline

  # ---------------------------------------------------------------- Source poller
  PollerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: poller
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: '*'
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${ArtifactBucket.Arn}/source/*'
              - Effect: Allow
                Action: [ssm:GetParameter, ssm:PutParameter]
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/pipeline/last-commit'
  SourcePoller:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${ProjectName}-source-poller'
      Description: Anonymously checks the public GitHub repo and hands new commits to CodePipeline via S3
      ServiceRole: !GetAtt PollerRole.Arn
      TimeoutInMinutes: 10
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            build:
              commands:
                - LATEST=$(git ls-remote "$REPO_URL" "refs/heads/$BRANCH" | cut -f1)
                - LAST=$(aws ssm get-parameter --name "$PARAM" --query Parameter.Value --output text)
                - echo "remote=$LATEST last-handed-off=$LAST"
                - |
                  if [ -n "$LATEST" ] && [ "$LATEST" != "$LAST" ]; then
                    git clone --depth 1 --branch "$BRANCH" "$REPO_URL" src
                    echo "$LATEST" > src/COMMIT_SHA
                    (cd src && zip -qr ../source.zip . -x '.git/*')
                    aws s3 cp source.zip "s3://$BUCKET/source/source.zip" --metadata commit="$LATEST"
                    aws ssm put-parameter --name "$PARAM" --value "$LATEST" --type String --overwrite
                    echo "Handed commit $LATEST to CodePipeline"
                  else
                    echo "No new commits on $BRANCH"
                  fi
      Artifacts: { Type: NO_ARTIFACTS }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        EnvironmentVariables:
          - { Name: REPO_URL, Value: !Ref RepositoryUrl }
          - { Name: BRANCH, Value: !Ref Branch }
          - { Name: BUCKET, Value: !Ref ArtifactBucket }
          - { Name: PARAM, Value: !Ref LastCommitParameter }
      LogsConfig:
        CloudWatchLogs: { Status: ENABLED, GroupName: !Sub '/codebuild/${ProjectName}-source-poller' }

  EventsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: start-poller-and-pipeline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: codebuild:StartBuild
                Resource: !GetAtt SourcePoller.Arn
              - Effect: Allow
                Action: codepipeline:StartPipelineExecution
                Resource: !Sub 'arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}'
  PollScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-source-poll'
      ScheduleExpression: !Ref PollSchedule
      State: ENABLED
      Targets:
        - Id: poller
          Arn: !GetAtt SourcePoller.Arn
          RoleArn: !GetAtt EventsRole.Arn

  # ---------------------------------------------------------------- Build
  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: build
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: '*'
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject]
                Resource: !Sub '${ArtifactBucket.Arn}/*'
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ProjectName}-web'
                  - !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ProjectName}-worker'
  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${ProjectName}-build'
      Description: Builds web and worker images and pushes them to ECR
      ServiceRole: !GetAtt BuildRole.Arn
      TimeoutInMinutes: 20
      Source:
        Type: CODEPIPELINE
        BuildSpec: pipeline/buildspec.yml
      Artifacts: { Type: CODEPIPELINE }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        PrivilegedMode: true            # needed for docker build
        EnvironmentVariables:
          - { Name: WEB_REPO_URI, Value: { 'Fn::ImportValue': !Sub '${ProjectName}-WebRepoUri' } }
          - { Name: WORKER_REPO_URI, Value: { 'Fn::ImportValue': !Sub '${ProjectName}-WorkerRepoUri' } }
      LogsConfig:
        CloudWatchLogs: { Status: ENABLED, GroupName: !Sub '/codebuild/${ProjectName}-build' }

  # ---------------------------------------------------------------- Pipeline
  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codepipeline.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: pipeline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:GetBucketVersioning, s3:PutObject, s3:ListBucket]
                Resource: [!GetAtt ArtifactBucket.Arn, !Sub '${ArtifactBucket.Arn}/*']
              - Effect: Allow
                Action: [codebuild:StartBuild, codebuild:BatchGetBuilds]
                Resource: !GetAtt BuildProject.Arn
              - Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                  - ecs:DescribeTasks
                  - ecs:ListTasks
                  - ecs:RegisterTaskDefinition
                  - ecs:UpdateService
                  - ecs:TagResource
                Resource: '*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: '*'
                Condition:
                  StringEqualsIfExists:
                    iam:PassedToService: ecs-tasks.amazonaws.com
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub '${ProjectName}-pipeline'
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: GitHubSnapshot
              ActionTypeId: { Category: Source, Owner: AWS, Provider: S3, Version: '1' }
              Configuration:
                S3Bucket: !Ref ArtifactBucket
                S3ObjectKey: source/source.zip
                PollForSourceChanges: false   # EventBridge rule below triggers instead
              OutputArtifacts: [{ Name: SourceOutput }]
        - Name: Build
          Actions:
            - Name: BuildAndPushImages
              ActionTypeId: { Category: Build, Owner: AWS, Provider: CodeBuild, Version: '1' }
              Configuration:
                ProjectName: !Ref BuildProject
              InputArtifacts: [{ Name: SourceOutput }]
              OutputArtifacts: [{ Name: WebImageDef }, { Name: WorkerImageDef }]
        - Name: Deploy
          Actions:
            - Name: DeployWeb
              ActionTypeId: { Category: Deploy, Owner: AWS, Provider: ECS, Version: '1' }
              Configuration:
                ClusterName: { 'Fn::ImportValue': !Sub '${ProjectName}-Cluster' }
                ServiceName: !Sub '${ProjectName}-web'
                FileName: imagedefinitions-web.json
                DeploymentTimeout: '20'
              InputArtifacts: [{ Name: WebImageDef }]
            - Name: DeployWorker
              ActionTypeId: { Category: Deploy, Owner: AWS, Provider: ECS, Version: '1' }
              Configuration:
                ClusterName: { 'Fn::ImportValue': !Sub '${ProjectName}-Cluster' }
                ServiceName: !Sub '${ProjectName}-worker'
                FileName: imagedefinitions-worker.json
                DeploymentTimeout: '20'
              InputArtifacts: [{ Name: WorkerImageDef }]

  SourceChangedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-source-changed'
      Description: Start the pipeline when the poller uploads a new source snapshot
      EventPattern:
        source: [aws.s3]
        detail-type: [Object Created]
        detail:
          bucket: { name: [!Ref ArtifactBucket] }
          object: { key: [source/source.zip] }
      Targets:
        - Id: pipeline
          Arn: !Sub 'arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}'
          RoleArn: !GetAtt EventsRole.Arn

Outputs:
  PipelineName:
    Value: !Ref Pipeline
  ArtifactBucket:
    Value: !Ref ArtifactBucket
  PollerProject:
    Value: !Ref SourcePoller
